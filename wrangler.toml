name = "aetheris-lab-api"
main = "worker/index.ts"
compatibility_date = "2026-11-20"
workers_dev = false

# Replace these placeholders before deployment. No resources are provisioned automatically.
[[d1_databases]]
binding = "DB"
database_name = "aetheris-lab"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "aetheris-lab-private-images"
